# DESIGN TEMPLATE ONLY: proposed smoke settings for the agent to implement.
# These small sizes are not adequate evidence for scientific superiority.
schema_version: 1
profile: smoke
evidence_tier: SMOKE
allow_scientific_promotion: false
seed: 1701
scenario: base_identifiable
simulation:
  donors: 8
  cells_per_donor: 30
  genes: 180
  true_programs: 3
  observation_model: poisson
  independent_replicates: 1
factorization:
  backend: pinned_upstream_cnmf
  loss: frobenius
  candidate_ranks: [2, 3, 4]
  # Must be >= 4, measured, not preference. cNMF computes
  # n_neighbors = int(local_neighborhood_size * merged_spectra.shape[0] / k), and
  # merged_spectra has n_iter*k rows, so it reduces to int(0.30 * n_iter) regardless of
  # k. At n_iter <= 3 it is zero, local_density becomes a division by zero, and
  # consensus() dies with "Zero components remain after density filtering. Consider
  # increasing density threshold" — a message that misdescribes the cause, since raising
  # the threshold cannot fix it. Was 3; every consensus call would have failed.
  # Regression test: cnmfbench/tests/test_io_and_cnmf_interop.py
  optimizer_starts: 5
  max_optimizer_iterations: 300
  # Must be < simulation.genes (180). Upstream defaults to 2000, which would make HVG
  # selection a silent no-op here: it takes the top-N by Fano ratio, so N > n_genes
  # returns every gene and the "high-variance panel" is the whole panel. That also makes
  # hvg_retention trivially 1.0 and hides exactly the failure it exists to detect.
  num_highvar_genes: 100
  # Enters the consensus artifact FILENAME via str(x).replace('.','_') -> 'dt_2_0'
  # (cnmf.py:878), so the identical Python value must reach consensus() and every reader.
  # Upstream defaults to 0.5. Measured at this scale: local_density maxes at 0.012 (K=3)
  # and 0.31 (K=4), so neither value filters any component -- the choice is about the
  # filename being predictable, not about the filter doing anything.
  density_threshold: 2.0
validation:
  outer_donor_folds: 2
  inner_donor_folds: 2
  # 0.5, not 0.7: the held-out overfit penalty scales as d_eff/|G_inf|, so a larger
  # inference panel flattens the K-curve and weakens the very signal feature A must
  # detect. Changed before any comparison was run. This is a config value, not a
  # frozen PROTOCOL rule.
  inference_gene_fraction: 0.5
  # PROTOCOL 4.1 requires the panel seed to be INDEPENDENT of the sampling seed and the
  # optimizer seed, so that panel variation and optimisation variation can be separated.
  # It is therefore a distinct value here, not derived from `seed` above. The throwaway
  # diagnostics.donor_blocking_gap draws its panel from the same rng as the donor
  # permutation; copying that would violate 4.1 silently.
  panel_seed: 20260917
  # Measured: sweeping this seed moves the K=3 held-out error by about +/-20% while the
  # K3->K4 gap is 2-5%. One repetition therefore records a single draw of a nuisance
  # larger than the effect it will later be used to detect. Raising it is P0-05 work; for
  # now the variance is named rather than hidden.
  panel_repetitions: 1
  projection: nonnegative_least_squares_frozen_dictionary
  transform: training_fitted_and_leakage_audited
resources:
  cores: 2
  blas_threads_per_job: 1
  memory_limit_mb: 4096
features:
  A: false
  B: false
  C: false
source_pins:
  # Resolved at S0-01/S0-02: local HEAD is byte-identical to dylkot/cNMF HEAD
  # (git ls-remote == git rev-parse HEAD), so this checkout IS the pinned upstream
  # reference, not a fork of it. cNMF 1.7.1. See DECISIONS.md D002.
  cnmf_full_commit_sha: 5dbc5baaa0b9079b55bce554d801caa235a50457
  # Still null: the optional GeneNMF R comparator is not part of this cycle and its
  # source has not been resolved. Must be pinned before any GeneNMF row is written.
  genenmf_full_commit_sha: null
# Scientific gates and source-pinning guards must distinguish smoke from confirmation.
